<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODUS Admin — Генератор договоров, смет и счетов</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #070913; color: #f8fafc; min-height: 100vh; font-family: 'Inter', sans-serif; }
        
        .auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.18) 0%, rgba(7, 9, 19, 0.98) 75%); }
        .auth-card { width: 100%; max-width: 420px; padding: 40px 32px; border-radius: 24px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); }
        .auth-logo { font-size: 2.2rem; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; margin-bottom: 8px; }
        .auth-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
        .auth-subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }
        .auth-input { width: 100%; padding: 14px 18px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(255, 255, 255, 0.15); color: #fff; font-size: 1rem; outline: none; text-align: center; letter-spacing: 2px; }
        .auth-input:focus { border-color: #6366f1; box-shadow: 0 0 20px rgba(99, 102, 241, 0.35); }
        .auth-error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }

        .admin-dashboard { display: none; padding-top: 40px; padding-bottom: 60px; }
        .admin-header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 20px; }
        .admin-title-row h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
        
        .admin-tabs { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; }
        .admin-tab-btn { padding: 9px 16px; border-radius: 10px; border: none; background: transparent; color: #94a3b8; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .admin-tab-btn:hover { color: #fff; }
        .admin-tab-btn.active { background: #6366f1; color: #fff; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35); }

        .admin-grid { display: grid; grid-template-columns: 520px 1fr; gap: 24px; align-items: start; }
        .admin-sidebar-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
        .admin-section-heading { font-size: 0.98rem; font-weight: 700; color: #38bdf8; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 6px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .form-row label { font-size: 0.76rem; font-weight: 600; color: #94a3b8; }
        
        select.admin-select, select.admin-select option, .admin-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 9px;
            background-color: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc !important;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
        }
        select.admin-select option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 8px 10px;
        }
        select.admin-select:focus, .admin-input:focus { border-color: #6366f1 !important; }
        
        .split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .split-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

        .module-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }
        .module-card.active {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.06);
        }
        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .module-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.86rem;
            color: #f8fafc;
            cursor: pointer;
        }
        .module-cb { width: 17px; height: 17px; accent-color: #6366f1; cursor: pointer; }
        
        .vendor-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
        .badge-amo { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-bx  { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
        .badge-wz  { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-sip { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-nodus { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

        .price-override-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 6px;
        }
        .price-val-inp { width: 130px !important; font-weight: 800; color: #38bdf8 !important; text-align: right; padding: 4px 6px !important; }
        .discount-val-inp { width: 65px !important; color: #f87171 !important; text-align: center; padding: 4px 4px !important; }

        .items-builder-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 6px; max-height: 160px; overflow-y: auto; }
        .item-row { display: grid; grid-template-columns: 1fr 85px 26px; gap: 5px; align-items: center; margin-bottom: 5px; }
        .btn-del-item { width: 26px; height: 30px; border-radius: 6px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-del-item:hover { background: #ef4444; color: #fff; }
        .btn-add-item { width: 100%; padding: 6px; border-radius: 8px; background: rgba(99, 102, 241, 0.12); border: 1px dashed rgba(99, 102, 241, 0.4); color: #818cf8; font-weight: 600; font-size: 0.76rem; cursor: pointer; }

        .fin-badge-box { background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
        .fin-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: #94a3b8; }
        .fin-row.highlight { color: #38bdf8; font-weight: 600; }
        .fin-row.deduct { color: #f87171; font-size: 0.78rem; }
        .fin-row.total { font-size: 1.05rem; font-weight: 800; color: #38bdf8; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 6px; margin-top: 2px; }
        .fin-row.net-profit { font-size: 1.18rem; font-weight: 900; color: #22c55e; border-top: 1.5px solid rgba(34, 197, 94, 0.4); padding-top: 6px; margin-top: 2px; }

        .doc-preview-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 22px; }
        .doc-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; gap: 10px; }
        
        /* CRITICAL PRINTABLE PAPER DARK TEXT ENFORCEMENT */
        .doc-paper { 
            background-color: #ffffff !important; 
            color: #1e293b !important; 
            border-radius: 12px; 
            padding: 44px 38px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); 
            font-family: 'Inter', sans-serif; 
            font-size: 12.5px; 
            line-height: 1.55; 
        }
        .doc-paper,
        .doc-paper *,
        .doc-paper div,
        .doc-paper p,
        .doc-paper span,
        .doc-paper b,
        .doc-paper strong,
        .doc-paper h1,
        .doc-paper h2,
        .doc-paper h3,
        .doc-paper h4,
        .doc-paper table,
        .doc-paper tr,
        .doc-paper th,
        .doc-paper td,
        .doc-paper ul,
        .doc-paper li {
            color: #1e293b !important;
        }
        .doc-paper th {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            font-weight: 700 !important;
        }
        .doc-paper .doc-brand-title { font-size: 22px; font-weight: 900; color: #0f172a !important; letter-spacing: -0.5px; }
        .doc-paper .doc-brand-subtitle { font-size: 10.5px; color: #64748b !important; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .doc-paper .doc-meta-right { text-align: right; font-size: 11.5px; color: #475569 !important; }
        .doc-paper .doc-main-title { text-align: center; font-size: 15px; font-weight: 800; color: #0f172a !important; margin-bottom: 4px; text-transform: uppercase; }
        .doc-paper .doc-main-subtitle { text-align: center; font-size: 11px; color: #64748b !important; margin-bottom: 16px; }
        .doc-paper .doc-section-h { font-size: 12px; font-weight: 700; color: #0f172a !important; margin-top: 14px; margin-bottom: 4px; border-bottom: 1px solid #cbd5e1 !important; padding-bottom: 3px; }
        .doc-paper .doc-p { margin-bottom: 7px; text-align: justify; color: #334155 !important; }
        .doc-paper .doc-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 11.5px; }
        .doc-paper .doc-table th, .doc-paper .doc-table td { border: 1px solid #cbd5e1 !important; padding: 6px 8px; text-align: left; }
        .doc-paper .doc-signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px; padding-top: 16px; border-top: 1.5px solid #cbd5e1 !important; }
        .doc-paper .sig-block h4 { font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #0f172a !important; }
        .doc-paper .sig-line { margin-top: 30px; border-bottom: 1px dashed #64748b !important; padding-bottom: 3px; font-size: 10.5px; color: #64748b !important; }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            .header, .admin-header-bar, .admin-sidebar-card, .doc-toolbar, .scroll-top-btn, .mobile-calc-bar, .live-toast { display: none !important; }
            .admin-dashboard { display: block !important; padding: 0 !important; }
            .admin-grid { display: block !important; }
            .doc-preview-card { background: transparent !important; border: none !important; padding: 0 !important; box-shadow: none !important; }
            .doc-paper { box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
            @page { size: A4; margin: 12mm 12mm 12mm 12mm; }
        }
        @media (max-width: 1100px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
