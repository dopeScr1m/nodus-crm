<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonNodusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanPurpleDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="24" fill="url(#bgGradDark)"/>
  <rect width="896" height="236" x="2" y="2" rx="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Icon (Left) -->
  <g transform="translate(48, 30)">
    <!-- Squircle container -->
    <rect width="180" height="180" rx="44" fill="url(#iconBgGrad)"/>
    <rect width="176" height="176" x="2" y="2" rx="42" fill="none" stroke="url(#neonNodusGrad)" stroke-width="3" opacity="0.6"/>
    
    <!-- Monogram N with connected nodes -->
    <g transform="translate(180, 180) scale(0.35) translate(-256, -256)" filter="url(#logoGlow)">
      <line x1="140" y1="372" x2="140" y2="140" stroke="url(#neonNodusGrad)" stroke-width="46" stroke-linecap="round"/>
      <line x1="140" y1="140" x2="372" y2="372" stroke="url(#neonNodusGrad)" stroke-width="46" stroke-linecap="round"/>
      <line x1="372" y1="372" x2="372" y2="140" stroke="url(#neonNodusGrad)" stroke-width="46" stroke-linecap="round"/>
      <circle cx="140" cy="140" r="32" fill="url(#cyanPurpleDot)"/>
      <circle cx="372" cy="372" r="32" fill="url(#cyanPurpleDot)"/>
      <circle cx="140" cy="372" r="26" fill="#6366f1"/>
      <circle cx="372" cy="140" r="26" fill="#06b6d4"/>
    </g>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(264, 134)">
    <text font-family="Plus Jakarta Sans, Montserrat, Inter, -apple-system, sans-serif" font-weight="900" font-size="88" letter-spacing="-3" fill="#ffffff">
      NODUS<tspan fill="url(#neonNodusGrad)">.</tspan>
    </text>
    <text y="42" x="4" font-family="Plus Jakarta Sans, Montserrat, Inter, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="7" fill="#94a3b8" text-transform="uppercase">
      CRM &amp; TELEPHONY INTEGRATION
    </text>
  </g>
</svg>
