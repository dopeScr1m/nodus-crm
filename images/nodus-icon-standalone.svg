<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="icoNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="icoDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="icoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#icoGlow)">
    <line x1="140" y1="372" x2="140" y2="140" stroke="url(#icoNeon)" stroke-width="48" stroke-linecap="round"/>
    <line x1="140" y1="140" x2="372" y2="372" stroke="url(#icoNeon)" stroke-width="48" stroke-linecap="round"/>
    <line x1="372" y1="372" x2="372" y2="140" stroke="url(#icoNeon)" stroke-width="48" stroke-linecap="round"/>
    <circle cx="140" cy="140" r="32" fill="url(#icoDot)"/>
    <circle cx="372" cy="372" r="32" fill="url(#icoDot)"/>
    <circle cx="140" cy="372" r="26" fill="#6366f1"/>
    <circle cx="372" cy="140" r="26" fill="#06b6d4"/>
  </g>
</svg>
