<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="sqNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sqDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="sqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#sqBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#sqNeon)" stroke-width="4" opacity="0.5"/>

  <!-- Glowing Monogram N with Connected Nodes -->
  <g filter="url(#sqGlow)" transform="translate(0, -20)">
    <line x1="150" y1="360" x2="150" y2="150" stroke="url(#sqNeon)" stroke-width="44" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="362" y2="360" stroke="url(#sqNeon)" stroke-width="44" stroke-linecap="round"/>
    <line x1="362" y1="360" x2="362" y2="150" stroke="url(#sqNeon)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="150" cy="150" r="30" fill="url(#sqDot)"/>
    <circle cx="362" cy="360" r="30" fill="url(#sqDot)"/>
    <circle cx="150" cy="360" r="24" fill="#6366f1"/>
    <circle cx="362" cy="150" r="24" fill="#06b6d4"/>
  </g>

  <!-- Wordmark at bottom -->
  <text x="256" y="452" font-family="Plus Jakarta Sans, Montserrat, Inter, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#ffffff" text-anchor="middle">
    NODUS<tspan fill="url(#sqNeon)">.</tspan>
  </text>
</svg>
